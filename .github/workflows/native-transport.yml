name: Native transport

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/transport/**'
      - 'src/foundation/**'
      - 'src/root.zig'
      - 'build.zig'
      - 'build.zig.zon'
      - '.zigversion'
      - 'tools/native-transport/**'
      - 'tools/native_transport*.zig'
      - 'tools/reference_sources.zig'
      - 'tools/zig-downloads.json'
      - 'data/native-transport/**'
      - '.github/actions/install-zig/**'
      - '.github/workflows/native-transport.yml'
  pull_request:
    paths:
      - 'src/transport/**'
      - 'src/foundation/**'
      - 'src/root.zig'
      - 'build.zig'
      - 'build.zig.zon'
      - '.zigversion'
      - 'tools/native-transport/**'
      - 'tools/native_transport*.zig'
      - 'tools/reference_sources.zig'
      - 'tools/zig-downloads.json'
      - 'data/native-transport/**'
      - '.github/actions/install-zig/**'
      - '.github/workflows/native-transport.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-transport:
    name: ${{ matrix.os }} / native transport
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Test Zig native tools
        run: zig build check-native-tools --summary all
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install upstream Mbed TLS generator requirements
        run: python -m pip install --require-hashes -r data/native-transport/python-requirements.txt
      - name: Build and test native candidate
        run: zig build native-transport --summary all
