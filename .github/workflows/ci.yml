name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        optimize: [debug, safe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src data/bedrock/root.zig tools
      - name: Check maintenance tools
        run: zig build check-tools -Doptimize=${{ matrix.optimize }} --summary all
      - name: Verify oracle fixtures
        run: zig build check-fixtures -Doptimize=${{ matrix.optimize }} --summary all
      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}
      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
