name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        optimize: [debug, safe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned Zig
        run: python tools/bootstrap_zig.py --github-path
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src data/bedrock/root.zig
      - name: Verify NBT fixtures
        run: python tools/check_nbt_fixtures.py
      - name: Verify math fixtures
        run: python tools/check_math_fixtures.py
      - name: Verify registry generation
        run: python tools/generate_registries.py --check
      - name: Verify registry oracle fixtures
        run: python tools/check_registry_fixtures.py
      - name: Verify block-state oracle fixtures
        run: python tools/check_block_fixtures.py
      - name: Test registry generator
        run: python tools/test_registry_codegen.py
      - name: Test registry compile contracts
        run: python tools/test_registry_compile.py
      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}
      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
